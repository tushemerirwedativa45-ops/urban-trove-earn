<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Urban Trove Earn</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .callback-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #002a5c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon { font-size: 4rem; color: #28a745; margin-bottom: 20px; }
        .error-icon { font-size: 4rem; color: #dc3545; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div id="loading-state">
            <div class="loading-spinner"></div>
            <h2>🔄 Verifying Payment...</h2>
            <p>Please wait while we confirm your payment with Flutterwave.</p>
        </div>

        <div id="success-state" style="display:none;">
            <div class="success-icon">✅</div>
            <h2>Payment Successful!</h2>
            <p id="success-message">Your investment has been recorded successfully.</p>
            <button onclick="window.location.href='dashboard.html'" class="btn-primary">Go to Dashboard</button>
        </div>

        <div id="error-state" style="display:none;">
            <div class="error-icon">❌</div>
            <h2>Payment Failed</h2>
            <p id="error-message">There was an issue processing your payment.</p>
            <button onclick="window.location.href='deposit.html'" class="btn-primary">Try Again</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Get transaction reference from URL
        const urlParams = new URLSearchParams(window.location.search);
        const txRef = urlParams.get('tx_ref');
        const status = urlParams.get('status');

        async function verifyPayment() {
            if (!txRef) {
                showError('Invalid payment reference');
                return;
            }

            try {
                // Verify payment with Flutterwave
                const response = await fetch(`https://api.flutterwave.com/v3/transactions/${txRef}/verify`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer FLWSECK_TEST-SANDBOXDEMOKEY-X' // Replace with your secret key
                    }
                });

                const result = await response.json();

                if (result.status === 'success' && result.data.status === 'successful') {
                    // Payment verified - complete the deposit
                    await completeDeposit(result.data);
                } else {
                    showError('Payment verification failed');
                }

            } catch (error) {
                console.error('Verification error:', error);
                showError('Unable to verify payment. Please contact support.');
            }
        }

        async function completeDeposit(paymentData) {
            const amount = paymentData.amount;
            const txRef = paymentData.tx_ref;

            // Update local storage
            loadData();
            
            // Find and update the pending transaction
            const pendingTxn = userData.transactions.find(t => t.txRef === txRef);
            if (pendingTxn) {
                pendingTxn.status = 'Completed';
                userData.balance += amount;
                userData.deposits += 1;
                userData.depositTotal = (userData.depositTotal || 0) + amount;
            }

            saveData();

            // Record on backend
            try {
                await fetch(`${API_BASE}/api/record-deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: amount,
                        email: paymentData.customer.email,
                        phone: paymentData.customer.phone_number,
                        name: paymentData.customer.name,
                        txRef: txRef
                    })
                });
            } catch (err) {
                console.log('Backend recording failed, but payment was successful');
            }

            showSuccess(amount);
        }

        function showSuccess(amount) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('success-state').style.display = 'block';
            document.getElementById('success-message').textContent = 
                `Your investment of UGX ${amount.toLocaleString()} has been recorded. You will earn 23% returns after 16 days.`;
        }

        function showError(message) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }

        // Start verification when page loads
        document.addEventListener('DOMContentLoaded', verifyPayment);
    </script>
</body>
</html>
